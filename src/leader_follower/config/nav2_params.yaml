map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""


amcl:
  ros__parameters:
    use_sim_time: true

    global_frame_id: map
    odom_frame_id: leader/odom
    base_frame_id: leader_base_link

    scan_topic: /leader/front_lidar/scan

    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 12.0

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.10
    update_min_a: 0.10

    transform_tolerance: 1.0
    tf_broadcast: true

    set_initial_pose: true
    initial_pose_x: 0.5
    initial_pose_y: 0.0
    initial_pose_a: 0.0


bt_navigator:
  ros__parameters:
    use_sim_time: true

    global_frame: map
    robot_base_frame: leader_base_link
    odom_topic: /leader/odom

    navigators:
      - navigate_to_pose
      - navigate_through_poses


controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 1.0

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      min_vel_x: 0.0
      max_vel_x: 0.45

      min_speed_xy: 0.0
      max_speed_xy: 0.45

      max_vel_y: 0.0

      min_vel_theta: -0.80
      max_vel_theta: 0.80

      acc_lim_x: 1.5
      acc_lim_y: 0.0
      acc_lim_theta: 2.0

      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -2.0

      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.7

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.2

      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - Oscillation
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist


planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: false


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: leader/odom
      robot_base_frame: leader_base_link

      rolling_window: true

      width: 4
      height: 4
      resolution: 0.05

      robot_radius: 0.30

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /leader/front_lidar/scan
          data_type: LaserScan

          marking: true
          clearing: true

          obstacle_max_range: 12.0
          raytrace_max_range: 12.0

          obstacle_min_range: 0.10
          raytrace_min_range: 0.10

          max_obstacle_height: 1.5
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: leader_base_link

      resolution: 0.05

      robot_radius: 0.30

      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /leader/front_lidar/scan
          data_type: LaserScan

          marking: true
          clearing: true

          obstacle_max_range: 12.0
          raytrace_max_range: 12.0

          obstacle_min_range: 0.10
          raytrace_min_range: 0.10

          max_obstacle_height: 1.5
          min_obstacle_height: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.35
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


behavior_server:
  ros__parameters:
    use_sim_time: true

    local_frame: leader/odom
    global_frame: map
    robot_base_frame: leader_base_link

    transform_tolerance: 1.0

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"


waypoint_follower:
  ros__parameters:
    use_sim_time: true

    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_bt_navigator:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: false


velocity_smoother:
  ros__parameters:
    use_sim_time: true

    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity:
      - 0.45
      - 0.0
      - 0.80

    min_velocity:
      - 0.0
      - 0.0
      - -0.80

    max_accel:
      - 1.5
      - 0.0
      - 2.0

    max_decel:
      - -1.0
      - 0.0
      - -2.0

    odom_topic: /leader/odom
    odom_duration: 0.1

    velocity_timeout: 1.0
